services:
  - type: web
    name: consensus-atelier-engine
    runtime: node
    buildCommand: npm ci --include=dev && npm run contracts:compile && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
